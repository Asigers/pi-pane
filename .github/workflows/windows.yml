name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Install official Pi CLI for RPC smoke
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.4.0
      - name: Smoke test real Pi RPC on Windows
        run: node tests/smoke-pi-rpc.mjs
      - name: Run frontend tests
        run: npm test
      - name: Check types
        run: npm run check
      - name: Generate Windows icons
        run: npm run icons
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned NSIS installer
        run: npm run build:windows
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-pane-windows-x64-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
